name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleRelease --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk NetSwitch.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NetSwitch-apk
          path: NetSwitch.apk
      # Тег latest всегда указывает на последнюю сборку
      - run: git tag -f latest && git push -f origin latest
      # Публичная ссылка на APK — скачивается без входа в GitHub
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: NetSwitch APK
          files: NetSwitch.apk
          make_latest: true
          body: |
            Виджет для переключения мобильной сети между 3G и 4G в одно касание.
            Widget to switch mobile network between 3G and 4G with one tap.

            **Скачать / Download:** `NetSwitch.apk` ниже / below.

            Для работы нужен [Shizuku](https://shizuku.rikka.app/download/). Настройка описана в [README](https://github.com/${{ github.repository }}#readme).
            Requires [Shizuku](https://shizuku.rikka.app/download/). Setup steps are in the [README](https://github.com/${{ github.repository }}#readme).

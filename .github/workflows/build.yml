name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleRelease --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk NetSwitch.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NetSwitch-apk
          path: NetSwitch.apk
      # Публичная ссылка на APK — скачивается без входа в GitHub
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: NetSwitch APK
          files: NetSwitch.apk
          make_latest: true
